services:
  db:
    image: postgres:16-alpine
    container_name: coach3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach_secret}
      POSTGRES_DB: ${POSTGRES_DB:-coach3_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coach} -d ${POSTGRES_DB:-coach3_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coach3-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: ${PORT:-8000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:-coach_secret}@db:5432/${POSTGRES_DB:-coach3_dev}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      COACH3_PASSPHRASE: ${COACH3_PASSPHRASE:-}
      COACH3_PASSPHRASE_HASH: ${COACH3_PASSPHRASE_HASH:-}
      AUTH_DISABLED_LOCALHOST: ${AUTH_DISABLED_LOCALHOST:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ALLOWED_LLM_HOSTS: ${ALLOWED_LLM_HOSTS:-}
      SCRUB_TERMS: ${SCRUB_TERMS:-}
      POLAR_CLIENT_ID: ${POLAR_CLIENT_ID:-}
      POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET:-}
      POLAR_REDIRECT_URI: ${POLAR_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/polar/callback}
      CONCEPT2_CLIENT_ID: ${CONCEPT2_CLIENT_ID:-}
      CONCEPT2_CLIENT_SECRET: ${CONCEPT2_CLIENT_SECRET:-}
      CONCEPT2_REDIRECT_URI: ${CONCEPT2_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/concept2/callback}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      SYNC_PAGE_LIMIT: ${SYNC_PAGE_LIMIT:-50}
    ports:
      - "${PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
