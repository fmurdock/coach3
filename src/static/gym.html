<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach3 — Gym Mode Voice Logger</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    .gym-container {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .session-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .session-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .offline-badge {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: var(--warning);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .mic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 16px 0 24px;
    }

    .mic-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: white;
      font-size: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .mic-btn:active { transform: scale(0.92); }
    .mic-btn.listening {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      animation: pulse 1.4s infinite;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .mic-label {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    .text-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      max-width: 560px;
    }

    .text-input-wrap input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
    }

    .staged-section {
      display: none;
      margin: 20px 0;
    }

    .staged-card {
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .transcript-quote {
      font-style: italic;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .candidate-block {
      background: rgba(9, 13, 22, 0.55);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field-full { grid-column: 1 / -1; }

    .field-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .field-group input, .field-group select {
      width: 100%;
      background: #0d131f;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .btn-action-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-confirm {
      flex: 2;
      background: var(--success);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      justify-content: center;
    }

    .btn-cancel {
      flex: 1;
      background: #1e293b;
      color: var(--text-muted);
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      justify-content: center;
    }

    .history-section { margin-top: 28px; }

    .history-header {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .set-item {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .set-item.pending-sync {
      border-color: var(--warning);
      opacity: 0.85;
    }

    .set-meta-exercise {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .set-meta-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .set-stats {
      text-align: right;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .set-stats-main {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }

    .set-stats-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <nav class="app-navbar">
    <a href="/dashboard" class="nav-brand">Coach<span>3</span></a>
    <div class="nav-links">
      <a href="/gym" class="nav-link active">🎙️ Gym Mode</a>
      <a href="/dashboard" class="nav-link">📊 Dashboard</a>
      <a href="/coach" class="nav-link">🤖 AI Coach</a>
      <a href="/config" class="nav-link">⚙️ Settings</a>
      <button id="btn-signout" class="btn-secondary nav-signout" style="display:none;">Sign Out</button>
    </div>
  </nav>

  <main class="gym-container">
    <div class="session-bar">
      <div id="session-badge" class="session-badge">Connecting session...</div>
      <button id="offline-queue-badge" class="offline-badge" type="button"></button>
    </div>

    <!-- Voice / Text Input -->
    <div class="mic-container">
      <button id="mic-btn" class="mic-btn" type="button" aria-label="Tap to speak">🎤</button>
      <div id="mic-label" class="mic-label">Tap microphone and speak your set</div>

      <div class="text-input-wrap">
        <input type="text" id="manual-text" placeholder='e.g. "bench press 225 lbs 3x5 then pullups 3x10"' />
        <button id="manual-parse-btn" class="btn-primary" type="button">Parse</button>
      </div>
    </div>

    <!-- Multi-clause Staged Review Card -->
    <section id="staged-section" class="staged-section">
      <div class="staged-card">
        <div class="card-header">
          <span class="card-title">Review &amp; Confirm</span>
          <span id="staged-confidence" class="badge"></span>
        </div>

        <div id="staged-transcript" class="transcript-quote"></div>
        <div id="staged-cards-container"></div>

        <div class="btn-action-group">
          <button id="btn-cancel" class="btn-cancel" type="button">Discard</button>
          <button id="btn-confirm" class="btn-confirm" type="button">✓ CONFIRM SETS</button>
        </div>
      </div>
    </section>

    <!-- Logged Sets Feed -->
    <section class="history-section">
      <div class="history-header">
        <span>Completed Sets Today</span>
        <span id="total-volume-ticker">0 lbs volume</span>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/gym.js"></script>
</body>
</html>
