<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach3 — Sign In</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .login-title span {
      color: var(--accent);
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .login-form input {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .login-form input:focus {
      border-color: var(--accent);
    }

    .login-btn {
      background: var(--accent-hover);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:hover {
      background: var(--accent);
      color: #04101e;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-title">Coach<span>3</span></div>
      <p class="login-sub">Enter your self-hosted passphrase to unlock your training telemetry, Gym Mode, and AI Coach.
      </p>
      <div id="login-error" class="login-error" role="alert"></div>
      <form id="login-form" class="login-form">
        <label for="passphrase">Passphrase</label>
        <input type="password" id="passphrase" name="passphrase" autocomplete="current-password" required autofocus
          placeholder="Enter passphrase">
        <button type="submit" id="login-submit" class="login-btn">Sign In</button>
      </form>
    </section>
  </main>
  <script src="/static/js/login.js"></script>
</body>

</html>
